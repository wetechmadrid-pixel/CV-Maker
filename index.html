<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Generador de CV — Plantillas + Personalización</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#071028; --panel:#071428; --muted:#9fb0c6; --accent:#6EE7B7; --card:#0b1220; --paper:#ffffff;
  --glass: rgba(255,255,255,0.03);
  --font:"Inter",system-ui;
  --font-size:14px;
  font-family:var(--font);
  font-size:var(--font-size);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:linear-gradient(180deg,var(--bg) 0%, #071428 100%);color:var(--paper);-webkit-font-smoothing:antialiased}
.app{max-width:1200px;margin:28px auto;padding:18px;display:grid;grid-template-columns:360px 1fr;gap:18px;}
.panel{background:var(--panel);padding:16px;border-radius:12px;border:1px solid rgba(255,255,255,0.03);height:calc(100vh - 56px);overflow:auto}
.brand{display:flex;gap:12px;align-items:center;margin-bottom:8px}
.logo{background:linear-gradient(135deg,var(--accent),#60a5fa);width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-weight:800;color:#052017}
h1{font-size:16px;margin:0}
.muted{color:var(--muted);font-size:13px;margin-top:6px}
input,textarea,select{font-family:inherit;font-size:14px}
label{display:block;color:var(--muted);font-size:13px;margin-top:12px}
input[type="text"], input[type="email"], textarea, select {
  width:100%; padding:10px 12px; border-radius:8px; border:1px solid rgba(255,255,255,0.03);
  background:transparent;color:var(--paper);font-size:14px;margin-top:6px;outline:none;
}
textarea{min-height:70px;resize:vertical}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;border:0;background:linear-gradient(90deg,#1f2937,#111827);color:var(--paper);cursor:pointer;font-weight:700}
.btn.ghost{background:transparent;border:1px solid rgba(255,255,255,0.04)}
.small{padding:6px 8px;font-size:13px}
.tpls{display:flex;gap:8px;margin-top:8px}
.tpl{padding:8px;border-radius:8px;background:linear-gradient(180deg, rgba(255,255,255,0.01), transparent);cursor:pointer;border:1px solid rgba(255,255,255,0.03);font-size:13px}
.tpl.active{outline:3px solid rgba(110,231,183,0.09);box-shadow:0 8px 28px rgba(2,6,23,0.6)}
.section{margin-top:12px}
.sectionList{margin-top:8px;display:flex;flex-direction:column;gap:8px}
.item{background:var(--glass);padding:8px;border-radius:8px;display:flex;flex-direction:column;gap:8px;border:1px solid rgba(255,255,255,0.02)}
.row{display:flex;gap:8px}
.dragHandle{cursor:grab;padding:6px;border-radius:6px;background:rgba(255,255,255,0.02);align-self:flex-start;font-size:13px;color:var(--muted)}
.removeBtn{background:none;border:none;color:#f97373;cursor:pointer;font-weight:700;padding:6px;border-radius:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:#f1f5f9;color:#0b1220;padding:6px 8px;border-radius:999px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.chip .x{background:transparent;border:none;color:#b91c1c;cursor:pointer;padding:0;margin-left:6px}
.previewWrap{padding:16px;border-radius:12px;background:linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.005));height:calc(100vh - 56px);overflow:auto}
.previewArea{background:var(--paper);color:#0b1220;border-radius:8px;padding:20px;max-width:900px;margin:auto;box-shadow:0 10px 30px rgba(2,6,23,0.06)}
.resume{display:flex;gap:18px;font-size:14px}
.col-left{width:28%;padding:12px}
.col-right{flex:1;padding:12px}
.name{font-size:26px;font-weight:800}
.title{font-size:13px;color:#475569;margin-bottom:8px}
.sectionTitle{font-weight:800;margin-top:12px;margin-bottom:8px}
.skillPill{display:inline-block;padding:6px 8px;border-radius:999px;font-size:12px;margin:6px 6px 6px 0;background:#eef2ff;color:#0b1220}
.template-modern .col-left{background:linear-gradient(180deg,#051022,#07162a);color:#cfeee1;border-radius:8px}
.template-modern .name{color:var(--accent)}
.template-classic .previewArea{font-family:Georgia,serif}
.template-classic .col-left{background:#f8fafc;color:#0b1220;border-radius:8px}
.template-creative .resume{flex-direction:column}
.template-creative .avatar{width:96px;height:96px;border-radius:12px;overflow:hidden;border:4px solid white}
.drag-over{outline:3px dashed rgba(59,130,246,0.25);border-radius:8px}
@media(max-width:900px){
  .app{grid-template-columns:1fr;padding:12px}
  .panel{height:auto}
  .previewWrap{height:auto;margin-top:12px}
  .resume{flex-direction:column}
}
</style>
</head>
<body>
<div class="app">
  <aside class="panel">
    <div class="brand">
      <div class="logo">CV</div>
      <div>
        <h1>Generador de CV</h1>
        <div class="muted">Plantillas + arrastrar y soltar</div>
      </div>
    </div>

    <label>Plantilla</label>
    <div class="tpls" id="templateChooser">
      <div class="tpl active" data-tpl="modern">Moderna</div>
      <div class="tpl" data-tpl="classic">Clásica</div>
      <div class="tpl" data-tpl="creative">Creativa</div>
    </div>

    <label>Foto</label>
    <input id="photoInput" type="file" accept="image/*">

    <label>Nombre completo</label>
    <input id="fullName" type="text" placeholder="Tu nombre" value="Jane Doe">

    <label>Título profesional</label>
    <input id="title" type="text" placeholder="Ej. Diseñadora de producto" value="Diseñadora de producto">

    <label>Correo electrónico</label>
    <input id="email" type="email" value="jane.doe@ejemplo.com">

    <label>Teléfono</label>
    <input id="phone" type="text" value="+34 600 123 456">

    <label>Resumen</label>
    <textarea id="summary">Diseñadora de producto enfocada en experiencias de usuario y sistemas de diseño.</textarea>

    <div class="section">
      <label>Color de acento</label>
      <input type="color" id="accentColor" value="#6EE7B7">
      <label>Color de fondo</label>
      <input type="color" id="bgColor" value="#071028">
      <label>Fuente</label>
      <select id="fontFamily">
        <option value="Inter, system-ui">Inter</option>
        <option value="Georgia, serif">Georgia</option>
        <option value="'Courier New', monospace">Courier New</option>
        <option value="'Roboto', sans-serif">Roboto</option>
      </select>
      <label>Tamaño de fuente</label>
      <input type="range" id="fontSize" min="12" max="18" value="14">
      <span id="fontSizeLabel" class="muted">14 px</span>
    </div>

    <div class="section">
      <label>Experiencia</label>
      <div id="expContainer" class="sectionList"></div>
      <div style="display:flex;gap:8px;margin-top:8px">
        <button id="addExp" class="btn small">+ Añadir</button>
        <button id="clearExp" class="btn small ghost">Borrar todo</button>
      </div>
    </div>

    <div class="section">
      <label>Educación</label>
      <div id="eduContainer" class="sectionList"></div>
      <div style="display:flex;gap:8px;margin-top:8px">
        <button id="addEdu" class="btn small">+ Añadir</button>
        <button id="clearEdu" class="btn small ghost">Borrar todo</button>
      </div>
    </div>

    <div class="section">
      <label>Habilidades</label>
      <div id="skillsContainer" class="chips"></div>
      <div style="display:flex;gap:8px;margin-top:8px">
        <input id="skillInput" type="text" placeholder="Añadir habilidad (Enter)">
        <button id="addSkill" class="btn small">Añadir</button>
      </div>
    </div>

    <div class="controls" style="margin-top:14px">
      <button id="downloadPdf" class="btn">Descargar PDF</button>
      <button id="exportJson" class="btn ghost">Exportar JSON</button>
      <button id="importJsonBtn" class="btn ghost">Importar JSON</button>
      <input id="importJson" type="file" accept="application/json" style="display:none">
    </div>
  </aside>

  <main class="previewWrap">
    <div id="previewArea" class="previewArea template-modern"></div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.3/html2pdf.bundle.min.js"></script>
<script>
/* === Estado inicial === */
const state = {
  template: 'modern',
  photoDataUrl: null,
  fullName: 'Jane Doe',
  title: 'Diseñadora de producto',
  email: 'jane.doe@ejemplo.com',
  phone: '+34 600 123 456',
  summary: 'Diseñadora de producto enfocada en experiencias de usuario y sistemas de diseño.',
  experience: [
    { company: 'Acme Co', role: 'Diseñadora Senior', period: '2020 — Presente', desc: 'Lideró el diseño de productos de análisis, mejorando la retención en un 18%.' }
  ],
  education: [
    { school: 'Universidad Estatal', degree: 'Grado en Diseño de Interacción', period: '2012 — 2016' }
  ],
  skills: ['UX', 'Sistemas de diseño', 'Figma', 'Prototipado'],
  accentColor: '#6EE7B7',
  bgColor: '#071028',
  fontFamily: 'Inter, system-ui',
  fontSize: 14
};

/* === Traducción en las plantillas === */
function renderExperienceHTML(list){
  if(!list.length) return `<div style="color:#475569">Sin experiencia</div>`;
  return list.map(e=>`
    <div style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between">
        <div style="font-weight:700">${e.role} — ${e.company}</div>
        <div style="font-size:12px;color:#475569">${e.period}</div>
      </div>
      <div style="margin-top:6px;color:#334155">${e.desc}</div>
    </div>`).join('');
}
function renderEducationHTML(list){
  if(!list.length) return `<div style="color:#475569">Sin educación</div>`;
  return list.map(e=>`<div style="margin-bottom:10px"><div style="font-weight:700">${e.degree} — ${e.school}</div><div style="font-size:12px;color:#475569">${e.period}</div></div>`).join('');
}
function renderSkillsHTML(list){
  if(!list.length) return `<div style="color:#475569">Sin habilidades</div>`;
  return list.map(s=>`<span class="skillPill">${s}</span>`).join('');
}

/* === Renderizado del CV === */
function renderPreview(){
  const a = s=>s||'';
  const photoHTML = state.photoDataUrl ? `<div style="width:84px;height:84px;border-radius:10px;overflow:hidden"><img src="${state.photoDataUrl}" style="width:100%;height:100%;object-fit:cover"></div>` : '';
  let html='';
  if(state.template==='modern'){
    html=`
    <div class="resume template-modern">
      <div class="col-left">
        <div class="name">${a(state.fullName)}</div>
        <div class="title">${a(state.title)}</div>
        <div class="sectionTitle">Contacto</div>
        <div>${a(state.email)}</div>
        <div>${a(state.phone)}</div>
        <div class="sectionTitle">Resumen</div>
        <div>${a(state.summary)}</div>
        <div class="sectionTitle">Habilidades</div>
        <div>${renderSkillsHTML(state.skills)}</div>
        <div class="sectionTitle">Educación</div>
        <div>${renderEducationHTML(state.education)}</div>
      </div>
      <div class="col-right">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div style="font-weight:800;font-size:18px">${a(state.fullName)}</div>
          ${photoHTML}
        </div>
        <div style="margin-top:12px">
          <div class="sectionTitle">Experiencia</div>
          ${renderExperienceHTML(state.experience)}
        </div>
      </div>
    </div>`;
  } else if(state.template==='classic'){
    html=`
    <div class="resume template-classic">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px">
        <div>
          <div style="font-weight:800;font-size:22px">${a(state.fullName)}</div>
          <div style="color:#475569">${a(state.title)}</div>
          <div style="margin-top:8px;color:#334155">${a(state.summary)}</div>
        </div>
        ${photoHTML}
      </div>
      <div style="display:flex;gap:20px">
        <div style="width:30%;padding-right:12px;border-right:1px solid #f1f5f9">
          <div class="sectionTitle">Contacto</div>
          <div>${a(state.email)}</div><div>${a(state.phone)}</div>
          <div class="sectionTitle">Habilidades</div>${renderSkillsHTML(state.skills)}
          <div class="sectionTitle">Educación</div>${renderEducationHTML(state.education)}
        </div>
        <div style="flex:1;padding-left:12px">
          <div class="sectionTitle">Experiencia</div>${renderExperienceHTML(state.experience)}
        </div>
      </div>
    </div>`;
  } else {
    html=`
    <div class="resume template-creative">
      <div style="display:flex;gap:16px;align-items:center">
        ${state.photoDataUrl ? `<div class="avatar"><img src="${state.photoDataUrl}" style="width:100%;height:100%;object-fit:cover"></div>` : ''}
        <div>
          <div style="font-weight:800;font-size:20px">${a(state.fullName)}</div>
          <div style="color:#334155">${a(state.title)}</div>
          <div style="margin-top:8px;color:#475569">${a(state.summary)}</div>
        </div>
        <div style="margin-left:auto;text-align:right">
          <div>${a(state.email)}</div>
          <div>${a(state.phone)}</div>
        </div>
      </div>
      <div style="display:flex;gap:18px;margin-top:16px">
        <div style="width:34%;background:#ffffff;padding:12px;border-radius:8px">
          <div class="sectionTitle">Habilidades</div>${renderSkillsHTML(state.skills)}
          <div class="sectionTitle">Educación</div>${renderEducationHTML(state.education)}
        </div>
        <div style="flex:1">
          <
