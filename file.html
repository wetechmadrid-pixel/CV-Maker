<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CV Maker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/templates.css" />
</head>
<body>
  <header class="topbar">
    <h1>CV Maker</h1>
    <div class="actions">
      <button id="btn-save-pdf">Download PDF</button>
      <button id="btn-save-draft">Save Draft</button>
      <button id="btn-load-draft">Load Draft</button>
      <select id="template-select">
        <option value="templateA">Template A - Clean</option>
        <option value="templateB">Template B - Two Column</option>
        <option value="templateC">Template C - Minimal</option>
      </select>
      <input type="color" id="theme-color" value="#0b5fff" />
      <select id="font-select">
        <option value="Inter,Arial,sans-serif">Inter</option>
        <option value="Georgia,serif">Georgia</option>
        <option value="'Source Sans Pro',Arial,sans-serif">Source Sans</option>
      </select>
    </div>
  </header>

  <main class="layout">
    <section class="form-panel">
      <h2>Details</h2>

      <div class="field-group">
        <label>Full Name</label>
        <input id="name" type="text" placeholder="Jane Doe" />
      </div>

      <div class="field-group">
        <label>Title</label>
        <input id="title" type="text" placeholder="Frontend Developer" />
      </div>

      <div class="field-row">
        <div class="field-group">
          <label>Email</label>
          <input id="email" type="email" placeholder="jane@example.com" />
        </div>
        <div class="field-group">
          <label>Phone</label>
          <input id="phone" type="tel" placeholder="+1 555 123 4567" />
        </div>
      </div>

      <div class="field-row">
        <div class="field-group">
          <label>Location</label>
          <input id="location" type="text" placeholder="City, Country" />
        </div>
        <div class="field-group">
          <label>Website</label>
          <input id="website" type="url" placeholder="https://..." />
        </div>
      </div>

      <div class="field-group">
        <label>Profile Summary</label>
        <textarea id="summary" rows="4" placeholder="Short summary about you"></textarea>
      </div>

      <div class="field-group">
        <label>Photo</label>
        <input id="photo" type="file" accept="image/*" />
      </div>

      <h3>Experience</h3>
      <div id="experience-list"></div>
      <button id="add-experience">+ Add Experience</button>

      <h3>Education</h3>
      <div id="education-list"></div>
      <button id="add-education">+ Add Education</button>

      <h3>Skills</h3>
      <div id="skills-list"></div>
      <div class="field-row">
        <input id="skill-input" type="text" placeholder="Add a skill" />
        <button id="add-skill">Add</button>
      </div>

      <h3>Projects</h3>
      <div id="projects-list"></div>
      <button id="add-project">+ Add Project</button>
    </section>

    <section class="preview-panel">
      <div id="cv-root">
        <!-- Live CV will be rendered here -->
      </div>
    </section>
  </main>

  <!-- Minimal: load html2pdf from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js" integrity="sha384-TpQe0wC4E2c3XWk2n9t7M2m9nqf2C7p8GQmWw1cF+1i0v82r8q8o3cGz9m0J9m0g" crossorigin="anonymous"></script>

  <script type="module" src="assets/js/templates.js"></script>
  <script type="module" src="assets/js/storage.js"></script>
  <script type="module" src="assets/js/export.js"></script>
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
